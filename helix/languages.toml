[[language]]
name="python"
auto-format=true
roots=["pyproject.toml", "setup.py", ".git"]
language-servers = ["pyright", "ruff"]

[[language]]
name="c"
scope="source.c"
auto-format=true
file-types = ["c", "h"]
indent = { tab-width = 4, unit = " " }

[[language]]
name="cpp"
auto-format=true
file-types = ["cc", "hh", "c++", "cpp", "hpp", "ipp", "tpp", "cxx", "hxx", "ixx", "txx", "ino", "C", "H", "cu", "cuh", "cppm", "h++", "ii", "inl", { glob = "*.hpp.in" }, { glob = "*.h.in" }]
indent = { tab-width = 4, unit = " " }

[language.formatter]
command = "black"
args = [
"-", # stdin
"--quiet",
"--line-length=90",
]

[[language]]
name = "html"
formatter = { command = 'prettier', args = ["--parser", "html"] }

[[language]]
name = "json"
formatter = { command = 'prettier', args = ["--parser", "json"] }

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }

[[language]]
name = "javascript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "typescript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "sql"
formatter = {command = "pg_format"}
auto-format = true

[language-server.pyright]
config=""
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "nasm"
indent = { tab-width = 4, unit = "    "}
scope = "source.nasm"
file-types = ["nasm"]

